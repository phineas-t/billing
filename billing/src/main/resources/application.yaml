spring:
  application:
    name: billing

  datasource:
    url: jdbc:postgresql://localhost:5433/billing_db?serverTimezone=Asia/Kolkata
    username: billing_user
    password: billing_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-min-32-characters-long}
    access-token-minutes: 15
    refresh-token-days: 7


