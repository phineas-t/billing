spring:
  application:
    name: billing

  datasource:
    # Railway automatically provides PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:billing_db}
    username: ${PGUSER:billing_user}
    password: ${PGPASSWORD:billing_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDISHOST:localhost}
      port: ${REDISPORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-min-32-characters-long}
    access-token-minutes: 15
    refresh-token-days: 7

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

server:
  port: ${PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs