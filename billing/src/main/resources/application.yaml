spring:
  application:
    name: billing

  datasource:
    # Use Railway's DATABASE_URL, fallback to local Docker if not found
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/billing_db}
    username: ${DATABASE_USERNAME:billing_user}
    password: ${DATABASE_PASSWORD:billing_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # Use Railway's REDIS_URL (full URI), fallback to local if not found
      url: ${REDIS_URL:redis://localhost:6379}

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-min-32-characters-long}
    access-token-minutes: 15
    refresh-token-days: 7

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

server:
  port: ${PORT:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs