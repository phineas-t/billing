spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing_test
    username: test_user
    password: test_pass
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 120000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  test:
    context:
      cache:
        max-size: 1

security:
  jwt:
    secret: test-secret-key-min-32-characters-long
    access-token-minutes: 15
    refresh-token-days: 7

stripe:
  secret-key: sk_test_placeholder
  webhook-secret: whsec_placeholder

server:
  port: 0

springdoc:
  swagger-ui:
    enabled: false











